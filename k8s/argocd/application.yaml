apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: storyforge
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  # Source repository
  source:
    repoURL: https://github.com/YOUR_USERNAME/reusable-intelligence-hackathon3.git
    targetRevision: main
    path: k8s/app

  # Destination cluster
  destination:
    server: https://kubernetes.default.svc
    namespace: storyforge

  # Sync policy
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - CreateNamespace=true
    - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  # Health checks
  ignoreDifferences:
  - group: apps
    kind: Deployment
    jsonPointers:
    - /spec/replicas
