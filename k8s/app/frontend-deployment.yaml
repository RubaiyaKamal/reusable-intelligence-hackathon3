apiVersion: apps/v1
kind: Deployment
metadata:
  name: storyforge-frontend
  namespace: storyforge
  labels:
    app: storyforge-frontend
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: storyforge-frontend
  template:
    metadata:
      labels:
        app: storyforge-frontend
        component: frontend
    spec:
      containers:
      - name: frontend
        image: ${DOCKER_REGISTRY}/storyforge-frontend:${IMAGE_TAG}
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: NODE_ENV
          value: "production"
        - name: NEXT_PUBLIC_API_URL
          value: "https://api.storyforge.example.com"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: storyforge-frontend
  namespace: storyforge
  labels:
    app: storyforge-frontend
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: storyforge-frontend
