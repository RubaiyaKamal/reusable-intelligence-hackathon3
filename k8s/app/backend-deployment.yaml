apiVersion: apps/v1
kind: Deployment
metadata:
  name: storyforge-backend
  namespace: storyforge
  labels:
    app: storyforge-backend
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: storyforge-backend
  template:
    metadata:
      labels:
        app: storyforge-backend
        component: backend
    spec:
      containers:
      - name: backend
        image: ${DOCKER_REGISTRY}/storyforge-backend:${IMAGE_TAG}
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: storyforge-secrets
              key: openai-api-key
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: storyforge-secrets
              key: database-url
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "storyforge-kafka.storyforge.svc.cluster.local:9092"
        - name: REDIS_URL
          value: "redis://storyforge-redis.storyforge.svc.cluster.local:6379"
        - name: APP_NAME
          value: "storyforge-api"
        - name: PORT
          value: "8000"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: storyforge-backend
  namespace: storyforge
  labels:
    app: storyforge-backend
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: storyforge-backend
