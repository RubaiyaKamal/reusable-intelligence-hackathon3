apiVersion: v1
kind: Secret
metadata:
  name: storyforge-secrets
  namespace: storyforge
type: Opaque
stringData:
  # Replace these values with actual secrets
  # In production, use sealed-secrets or external secrets operator
  openai-api-key: "YOUR_OPENAI_API_KEY"
  database-url: "postgresql://storyforge_user:PASSWORD@storyforge-postgres.storyforge.svc.cluster.local:5432/storyforge_db"
  postgres-password: "GENERATE_SECURE_PASSWORD"
  redis-password: ""

---
# Example using kubectl to create from environment variables:
# kubectl create secret generic storyforge-secrets \
#   --from-literal=openai-api-key=$OPENAI_API_KEY \
#   --from-literal=database-url=$DATABASE_URL \
#   --from-literal=postgres-password=$POSTGRES_PASSWORD \
#   -n storyforge
